name: Update Streak Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Streak SVG
        run: |
          curl -s "https://github-readme-streak-stats.herokuapp.com?user=Dusky-77&theme=rust-ferris-dark&hide_border=true" -o streak.svg

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git diff --staged --quiet || git commit -m "Update streak stats SVG"
          git push
