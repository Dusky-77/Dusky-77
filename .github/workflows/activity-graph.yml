name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download activity graph SVG
        run: |
          curl -sL "https://github-readme-activity-graph-henna.vercel.app/graph?username=Dusky-77&bg_color=000000&color=9d9191&line=cdcfcf&point=a57db3&area=true&hide_border=true&area_color=a57db3" \
            -o activity-graph.svg

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          git diff --staged --quiet || git commit -m "Update activity graph SVG"
          git push
